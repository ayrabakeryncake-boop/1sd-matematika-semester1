  <script>
(() => {
  "use strict";
  const KEY="brainGamesMathV1", app=document.getElementById("app");
  const chapters=[
    {title:"Mengenal Angka dan Bilangan",icon:"🔢",desc:"Angka 0–20, menghitung benda, membaca angka, urutan, sebelum dan sesudah."},
    {title:"Membandingkan dan Mengurutkan Bilangan",icon:"⚖️",desc:"Lebih banyak atau sedikit, > < =, serta urutan naik dan turun."},
    {title:"Penjumlahan",icon:"🍎",desc:"Menggabungkan benda dan bilangan sampai 20 melalui gambar serta cerita."},
    {title:"Pengurangan",icon:"🧸",desc:"Mengambil benda dan menghitung sisa sampai 20."},
    {title:"Komposisi dan Penguraian Bilangan",icon:"🧩",desc:"Memecah bilangan, pasangan 5 dan 10, hubungan tambah dan kurang."},
    {title:"Mengenal Bentuk Geometri",icon:"🔺",desc:"Lingkaran, segitiga, persegi, persegi panjang dan benda di sekitar."},
    {title:"Pola dan Pengelompokan",icon:"🎨",desc:"Melanjutkan pola gambar, bentuk dan warna; mengelompokkan benda."},
    {title:"Posisi, Arah, dan Perbandingan Ukuran",icon:"🧭",desc:"Atas/bawah, kiri/kanan, dalam/luar, panjang, besar dan tinggi."}
  ];
  const words=["nol","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas","dua belas","tiga belas","empat belas","lima belas","enam belas","tujuh belas","delapan belas","sembilan belas","dua puluh"];
  const shapes=["lingkaran","segitiga","persegi","persegi panjang"], symbols=["●","▲","■","▰"];
  const defaults=()=>({soundEnabled:false,lastChapter:null,lastChapterScores:{},lastExamScore:null,questionHistory:{},lastSessions:{},active:null});
  let store=defaults(), storageOK=true, view="home", chapter=1, session=null, audio=null, toastTimer;
  try { const raw=localStorage.getItem(KEY);if(raw)store={...defaults(),...JSON.parse(raw)}; }catch(e){storageOK=false}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));storageOK=true}catch(e){storageOK=false}}
  const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const pick=a=>a[rand(0,a.length-1)];
  function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function numberOptions(answer,max=20){let s=new Set([answer]);while(s.size<4)s.add(Math.max(0,Math.min(max,answer+rand(-5,5))));return [...s].map(String)}
  function make(ch,type,q,correct,options,why,visual="",difficulty="mudah",key=""){
    const opts=shuffle([...new Set(options.map(String))]);
    if(opts.length<3||opts.filter(x=>x===String(correct)).length!==1)return null;
    return {id:`${ch}-${type}-${key}`,signature:`${ch}-${type}-${key}`,chapter:ch,difficulty,question:q,choices:opts,answer:String(correct),explanation:why,visual};
  }
  function generate(ch,exam=false){
    let n,a,b,v,arr,kind,answer,objects,items;
    const twist=exam?" Tantangan campuran:":"";
    switch(ch){
      case 1:
        kind=rand(0,4);n=rand(0,20);objects=pick(["🍎","⭐","🧸","✏️"]);
        if(kind===0){n=rand(1,12);return make(ch,"count",`${twist} Ada berapa ${objects} di sini?`,n,numberOptions(n),`Ada ${n} benda. Kita hitung satu per satu.`,objects.repeat(n),"mudah",`${objects}-${n}`)}
        if(kind===1)return make(ch,"read",`${twist} Bilangan ${n} dibaca ...`,words[n],shuffle([words[n],words[(n+1)%21],words[(n+2)%21],words[(n+3)%21]]),`${n} dibaca ${words[n]}.`,"🔢","mudah",String(n));
        if(kind===2){n=rand(1,19);return make(ch,"before",`${twist} Angka sebelum ${n} adalah ...`,n-1,numberOptions(n-1),`Sebelum ${n} adalah ${n-1}.`,"⬅️ 🔢","mudah",String(n))}
        if(kind===3){n=rand(0,19);return make(ch,"after",`${twist} Angka sesudah ${n} adalah ...`,n+1,numberOptions(n+1),`Sesudah ${n} adalah ${n+1}.`,"🔢 ➡️","mudah",String(n))}
        n=rand(0,17);return make(ch,"sequence",`${twist} Urutan naik setelah ${n}, ${n+1} adalah ...`,n+2,numberOptions(n+2),`Urutannya ${n}, ${n+1}, ${n+2}.`,"🪜","sedang",String(n));
      case 2:
        kind=rand(0,3);a=rand(0,20);b=rand(0,20);
        if(kind===0){answer=a>b?">":a<b?"<":"=";return make(ch,"symbol",`${twist} Pilih tanda yang tepat: ${a} ... ${b}`,answer,[">","<","="],`${a} ${answer} ${b}.`, "⚖️","sedang",`${a}-${b}`)}
        if(kind===1){a=rand(1,11);b=rand(1,11);if(a===b)b=b===11?b-1:b+1;answer=a>b?`${a} ${"🍎".repeat(a)}`:`${b} ${"🍎".repeat(b)}`;return make(ch,"more",`${twist} Kelompok mana yang lebih banyak?`,answer,[`${a} ${"🍎".repeat(a)}`,`${b} ${"🍎".repeat(b)}`,"Sama banyak","Tidak dapat dihitung"],`🍎 ${a} dibanding 🍎 ${b}`,`Kelompok ${Math.max(a,b)} lebih banyak daripada ${Math.min(a,b)}.`,"mudah",`${a}-${b}`)}
        if(kind===2){a=rand(0,15);b=rand(a+1,20);return make(ch,"smaller",`${twist} Mana bilangan yang lebih kecil dari ${a} dan ${b}?`,a,numberOptions(a),`${a} lebih kecil daripada ${b}.`,"🔢","mudah",`${a}-${b}`)}
        a=rand(0,16);v=shuffle([a,a+rand(1,2),a+rand(3,4)]);answer=[...v].sort((x,y)=>y-x).join(" – ");return make(ch,"descending",`${twist} Urutkan ${v.join(", ")} dari terbesar ke terkecil.`,answer,[answer,[...v].sort((x,y)=>x-y).join(" – "),`${v[0]} – ${v[1]} – ${v[2]}`,`${v[1]} – ${v[0]} – ${v[2]}`],`Dari yang terbesar: ${answer}.`,"🪜","sedang",v.join("-"));
      case 3:
        kind=rand(0,3);a=rand(0,10);b=rand(0,10);if(exam&&rand(0,1)){a=rand(5,14);b=rand(1,20-a)}
        n=a+b;objects=pick(["🍎","🧸","⭐"]);
        if(kind===0&&n<=14)return make(ch,"visual",`${twist} ${a} ${objects} ditambah ${b} ${objects}. Berapa semuanya?`,n,numberOptions(n),`${a} + ${b} = ${n}.`,`${objects.repeat(a)} + ${objects.repeat(b)}`,"mudah",`${a}-${b}-${objects}`);
        if(kind===1)return make(ch,"story",`${twist} Rani punya ${a} apel. Ia mendapat ${b} apel lagi. Berapa apel Rani sekarang?`,n,numberOptions(n),`${a} apel ditambah ${b} apel menjadi ${n} apel.`,"🍎","sedang",`${a}-${b}`);
        if(kind===2){a=rand(0,5);b=rand(0,5);n=a+b;return make(ch,"fingers",`${twist} Tunjukkan ${a} jari dan ${b} jari lagi. Berapa jari semuanya?`,n,numberOptions(n),`${a} + ${b} = ${n} jari.`,"🖐️ + 🖐️","mudah",`${a}-${b}`)}
        return make(ch,"sum",`${twist} Hitung ${a} + ${b} = ...`,n,numberOptions(n),`Gabungkan ${a} dan ${b}, hasilnya ${n}.`,"➕","sedang",`${a}-${b}`);
      case 4:
        kind=rand(0,3);a=rand(1,20);b=rand(0,a);n=a-b;objects=pick(["🍎","🧸","⭐"]);
        if(kind===0&&a<=12)return make(ch,"visual",`${twist} Ada ${a} ${objects}. Diambil ${b}. Berapa yang tersisa?`,n,numberOptions(n),`${a} − ${b} = ${n}.`,objects.repeat(a),"mudah",`${a}-${b}-${objects}`);
        if(kind===1)return make(ch,"story",`${twist} Budi punya ${a} kelereng. Ia memberikan ${b}. Berapa sisanya?`,n,numberOptions(n),`${a} dikurangi ${b} menjadi ${n}.`,"🔵","sedang",`${a}-${b}`);
        if(kind===2){a=rand(1,10);b=rand(0,a);n=a-b;return make(ch,"fingers",`${twist} Ada ${a} jari terangkat. ${b} jari dilipat. Berapa yang masih terangkat?`,n,numberOptions(n),`${a} − ${b} = ${n} jari.`,"🖐️","mudah",`${a}-${b}`)}
        return make(ch,"subtract",`${twist} Hitung ${a} − ${b} = ...`,n,numberOptions(n),`Mulai dari ${a}, kurangi ${b}, hasilnya ${n}.`,"➖","sedang",`${a}-${b}`);
      case 5:
        kind=rand(0,3);n=pick([5,10]);a=rand(0,n);b=n-a;
        if(kind===0)return make(ch,"pair",`${twist} ${a} + ... = ${n}. Angka yang hilang?`,b,numberOptions(b,10),`${a} dan ${b} bersama-sama membentuk ${n}.`,"🧩","mudah",`${n}-${a}`);
        if(kind===1)return make(ch,"split",`${twist} Pecah ${n} menjadi ${a} dan ...`,b,numberOptions(b,10),`${n} = ${a} + ${b}.`,"🔵 🟡","mudah",`${n}-${a}`);
        if(kind===2){n=rand(3,20);a=rand(0,n);b=n-a;return make(ch,"relation",`${twist} Jika ${a} + ${b} = ${n}, maka ${n} − ${a} = ...`,b,numberOptions(b),`Karena ${a} + ${b} = ${n}, maka ${n} − ${a} = ${b}.`,"➕ ➖","sedang",`${n}-${a}`)}
        n=rand(2,20);a=rand(0,n);b=n-a;return make(ch,"parts",`${twist} Ada ${n} balok. ${a} biru, sisanya kuning. Berapa balok kuning?`,b,numberOptions(b),`${n} − ${a} = ${b} balok kuning.`,"🟦 🟨","sedang",`${n}-${a}`);
      case 6:
        kind=rand(0,3);n=rand(0,3);items=[["jam dinding","lingkaran","🕒"],["rambu segitiga","segitiga","⚠️"],["ubin persegi","persegi","🟩"],["pintu","persegi panjang","🚪"]];
        if(kind===0)return make(ch,"icon",`${twist} Bentuk apakah ini: ${symbols[n]} ?`,shapes[n],shapes,`${symbols[n]} adalah ${shapes[n]}.`,symbols[n],"mudah",String(n));
        if(kind===1)return make(ch,"object",`${twist} Bentuk ${items[n][0]} mirip ...`,items[n][1],shapes,`${items[n][0]} mirip ${items[n][1]}.`,items[n][2],"sedang",String(n));
        if(kind===2)return make(ch,"sides",`${twist} Bentuk mana yang mempunyai ${n%2?3:4} sisi?`,n%2?"segitiga":"persegi",n%2?["segitiga","lingkaran","persegi","oval"]:["persegi","lingkaran","segitiga","oval"],n%2?"Segitiga mempunyai 3 sisi.":"Persegi mempunyai 4 sisi sama panjang.",n%2?"▲":"■","sedang",String(n));
        return make(ch,"group",`${twist} Pilih benda yang berbentuk ${shapes[n]}.`,items[n][0],items.map(x=>x[0]),`${items[n][0]} mirip ${shapes[n]}.`,items[n][2],"sedang",String(n));
      case 7:
        kind=rand(0,3);arr=pick([["🔴","🔵","🟢","🟡"],["⭐","🌙","☀️","🌈"],["▲","●","■","◆"]]);a=rand(0,3);b=(a+rand(1,3))%4;
        if(kind===0)return make(ch,"alternate",`${twist} Lanjutkan pola: ${arr[a]} ${arr[b]} ${arr[a]} ${arr[b]} ...`,arr[a],arr,`Pola bergantian: ${arr[a]}, ${arr[b]}, lalu ${arr[a]}.`,"🎨","mudah",`${arr.join("")}-${a}-${b}`);
        if(kind===1)return make(ch,"double",`${twist} Lanjutkan pola: ${arr[a]} ${arr[a]} ${arr[b]} ${arr[a]} ${arr[a]} ${arr[b]} ...`,arr[a],arr,`Polanya dua ${arr[a]} lalu satu ${arr[b]}.`,"🧩","sedang",`${arr.join("")}-${a}-${b}`);
        if(kind===2){n=rand(0,3);return make(ch,"colour",`${twist} Mana yang sekelompok dengan warna ${["merah","biru","hijau","kuning"][n]}?`,["🍓","🫐","🥬","🍋"][n],["🍓","🫐","🥬","🍋"],`${["🍓 stroberi merah","🫐 beri biru","🥬 sayur hijau","🍋 lemon kuning"][n]}.`,"🎨","mudah",String(n))}
        n=rand(0,3);return make(ch,"shape-group",`${twist} Pilih bentuk yang sekelompok dengan ${symbols[n]}.`,symbols[n],symbols,`Keduanya berbentuk ${shapes[n]}.`,symbols[n],"mudah",String(n));
      case 8:
        kind=rand(0,4);a=rand(0,3);objects=["🐱","🐰","🧸","🚗"];items=objects[a];
        if(kind===0)return make(ch,"vertical",`${twist} ${items} berada di atas kotak. Di mana posisi ${items}?`,"di atas",["di atas","di bawah","di dalam","di samping"],`${items} ada di atas kotak.`,`${items}\n📦`,"mudah",`${a}`);
        if(kind===1)return make(ch,"left",`${twist} ${items} ada di sebelah kiri pohon. Di mana posisi ${items}?`,"di kiri",["di kiri","di kanan","di atas","di dalam"],`${items} berada di kiri pohon.`,`${items}   🌳`,"mudah",`${a}`);
        if(kind===2)return make(ch,"right",`${twist} Pohon di kiri, ${items} di kanan. Di mana posisi ${items}?`,"di kanan",["di kanan","di kiri","di bawah","di dalam"],`${items} berada di kanan pohon.`,`🌳   ${items}`,"mudah",`${a}`);
        if(kind===3){n=rand(2,9);b=n+rand(1,8);return make(ch,"length",`${twist} Pensil A panjangnya ${n} balok. Pensil B ${b} balok. Mana yang lebih panjang?`,"pensil B",["pensil A","pensil B","sama panjang"],`${b} lebih besar daripada ${n}, jadi pensil B lebih panjang.`,"✏️ 📏","sedang",`${n}-${b}`)}
        n=rand(2,9);b=n+rand(1,8);return make(ch,"height",`${twist} Menara A setinggi ${n} balok. Menara B ${b} balok. Mana yang lebih rendah?`,"menara A",["menara A","menara B","sama tinggi"],`${n} lebih kecil daripada ${b}, jadi menara A lebih rendah.`,"🧱 🧱","sedang",`${n}-${b}`);
    }
  }
  function valid(q){return q&&q.choices.length>=3&&q.choices.length<=4&&new Set(q.choices).size===q.choices.length&&q.choices.filter(x=>x===q.answer).length===1&&!!q.explanation}
  function generateSession(chapterId,count=20,mode="chapter"){
    if(mode!=="remedial"&&count!==20)throw Error("Sesi utama harus berisi 20 soal.");
    const exam=mode==="exam", allocation=exam?shuffle([1,1,1,2,2,2,3,3,3,4,4,4,5,5,6,6,7,7,8,8]):Array(count).fill(chapterId);
    let result=[],used=new Set(), history=store.questionHistory||{};
    for(const ch of allocation){
      let candidate=null,previous=null;
      for(let tries=0;tries<1800;tries++){
        const q=generate(ch,exam);
        if(!valid(q)||used.has(q.signature))continue;
        if(!(history[ch]||[]).includes(q.signature)){candidate=q;break}
        if(!previous)previous=q;
      }
      candidate ||= previous;
      if(!candidate)throw Error("Belum dapat membuat soal yang berbeda. Coba lagi.");
      used.add(candidate.signature);result.push(candidate);
    }
    result=shuffle(result);
    if(result.length!==20||new Set(result.map(q=>q.signature)).size!==20||result.some(q=>!valid(q)))throw Error("Pemeriksaan soal gagal.");
    return result;
  }
  function markHistory(s){s.questions.forEach(q=>{const h=store.questionHistory[q.chapter] ||= [];if(!h.includes(q.signature))h.push(q.signature);if(h.length>1800)h.splice(0,h.length-1800)});save()}
  function btn(label,action,tone="#ffe69a",extra=""){return `<button type="button" data-action="${action}" ${extra} class="action bg-[${tone}]">${esc(label)}</button>`}
  const title=(text,sub="")=>`<h1 class="display text-3xl md:text-5xl mb-3">${esc(text)}</h1>${sub?`<p class="text-lg mb-6">${esc(sub)}</p>`:""}`;
  const back=(destination="chapters")=>`<button type="button" data-action="back" data-to="${destination}" class="pill mb-6">← Kembali</button>`;
  function notice(message){let el=document.getElementById("notice");if(!el){el=document.createElement("div");el.id="notice";el.setAttribute("role","status");el.className="fixed bottom-4 left-4 right-4 max-w-lg mx-auto z-40 card p-4 text-center font-bold shadow-xl";document.body.appendChild(el)}el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3800)}
  function render(){
    document.querySelectorAll("nav [data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
    document.getElementById("sound-toggle").textContent=store.soundEnabled?"🔊 Suara hidup":"🔇 Suara mati";
    document.getElementById("sound-toggle").setAttribute("aria-pressed",String(store.soundEnabled));
    let html="";
    if(view==="home"){
      const last=store.lastChapter?`Bab ${store.lastChapter}: ${chapters[store.lastChapter-1].title}`:"Belum ada";
      const score=store.lastChapter?store.lastChapterScores[store.lastChapter]:null;
      html=`<section class="card p-6 md:p-10 bg-[#fffefa] rise"><div class="grid md:grid-cols-[1fr_auto] gap-8 items-center"><div>${title("Yuk, Main dan Belajar Matematika!","Pilih bab, jawab tantangan, kumpulkan bintang, dan jadilah jago matematika!")}<p class="font-bold bg-[#d9f2ff] rounded-2xl p-4 inline-block mb-6">🤖 Halo, teman kecil! Siap berpetualang di dunia angka?</p><div class="flex flex-wrap gap-4">${btn("Mulai Belajar","continueStart")}${btn("Pilih Bab","chapters","#c8f3de")}${btn("Tantangan Ujian Semester 1","examIntro","#ffdce7")}${btn("Petunjuk Bermain","help","#d9f2ff")}</div></div><div class="justify-self-center robot" aria-label="Robot matematika tersenyum" role="img"><div class="robot-eyes"><i></i><i></i></div><div class="robot-smile"></div></div></div></section><section class="grid sm:grid-cols-3 gap-4 mt-6" aria-label="Ringkasan progres"><div class="card p-5">📚 <strong>Bab terakhir</strong><p>${esc(last)}</p></div><div class="card p-5">🎯 <strong>Hasil bab terakhir</strong><p>${score==null?"Belum ada":score+" bintang"}</p></div><div class="card p-5">⭐ <strong>Bintang terkumpul</strong><p>${store.stars||0}</p></div></section>`;
    } else if(view==="chapters"){
      html=`${back("home")}${title("Pilih Bab","Setiap petualangan punya 20 soal baru.")}<div class="grid md:grid-cols-2 gap-5">${chapters.map((c,i)=>`<article class="card p-6 rise"><div class="text-5xl mb-3" aria-hidden="true">${c.icon}</div><p class="font-extrabold text-[#a35b16]">BAB ${i+1}</p><h2 class="display text-2xl my-2">${c.title}</h2><p class="mb-3">${c.desc}</p><p class="font-bold">20 soal per sesi · Soal berubah setiap bermain</p><p class="my-3">Hasil terakhir: ${store.lastChapterScores[i+1]==null?"Belum ada":store.lastChapterScores[i+1]+" bintang"}</p>${btn("Mulai Bermain","intro","#c8f3de",`data-ch="${i+1}"`)}</article>`).join("")}</div><p class="mt-6 p-4 card">📖 Materi dapat disesuaikan dengan buku pelajaran dan kurikulum sekolah.</p>`;
    } else if(view==="intro"){
      const c=chapters[chapter-1];html=`${back()}<section class="card p-7 md:p-10 text-center bg-[#d9f2ff]"><div class="text-6xl mb-4">${c.icon}</div><p class="font-extrabold">BAB ${chapter}</p>${title(c.title)}<p class="text-lg mb-5">${c.desc}</p><p class="font-bold mb-6">20 soal per sesi · Soal berubah setiap bermain</p>${btn("Mulai Bermain","start")}</section>`;
    } else if(view==="examIntro"){
      html=`${back("home")}<section class="card p-8 text-center bg-[#ffdce7]"><div class="text-6xl mb-4">🏆</div>${title("Tantangan Ujian Akhir Semester 1")}<h2 class="display text-2xl mb-3">Siap mengikuti Tantangan Matematika Semester 1?</h2><p class="text-xl mb-6">Kerjakan 20 soal dan tunjukkan kemampuan terbaikmu!</p><p class="mb-6">Soal campuran dari semua 8 bab · 5 poin untuk jawaban benar</p>${btn("Mulai Tantangan","startExam")}</section>`;
    } else if(view==="question"){
      if(!session||!session.questions?.[session.index]){store.active=null;save();view="home";return render()}
      const q=session.questions[session.index],answered=session.answers[session.index]!=null,chosen=session.answers[session.index],correct=chosen===q.answer;
      html=`${back("home")}<section class="card p-5 md:p-9 rise"><div class="flex flex-wrap justify-between gap-2 font-bold"><span>${session.mode==="exam"?"🏆 Tantangan Ujian Akhir Semester 1":`BAB ${session.chapter} · ${chapters[session.chapter-1].title}`}</span><span>Soal ${session.index+1} dari ${session.questions.length}</span></div><div class="meter my-5" role="progressbar" aria-valuenow="${session.index+1}" aria-valuemin="0" aria-valuemax="${session.questions.length}" aria-label="Kemajuan soal"><span style="width:${((session.index+1)/session.questions.length)*100}%"></span></div><h1 class="display text-2xl md:text-4xl mb-6">${esc(q.question)}</h1>${q.visual?`<div class="visual whitespace-pre-line bg-[#fff5d7] rounded-2xl p-5 mb-6 text-center" aria-label="Ilustrasi soal">${esc(q.visual)}</div>`:""}<div class="grid sm:grid-cols-2 gap-3">${q.choices.map((option,i)=>`<button type="button" class="choice ${answered?(option===q.answer?"correct":option===chosen?"wrong":""):""}" data-action="answer" data-choice="${i}" ${answered?"disabled":""}>${esc(option)}</button>`).join("")}</div>${answered?`<div class="mt-6 rounded-2xl p-5 ${correct?"bg-[#c8f3de]":"bg-[#ffdce7]"}" role="status"><p class="text-xl font-extrabold mb-2">${correct?"🌟 Hebat! Jawabanmu benar! Kamu mendapatkan 5 bintang.":"💛 Tidak apa-apa, yuk belajar bersama!"}</p>${correct?"":`<p>Jawaban yang benar adalah <strong>${esc(q.answer)}</strong>.</p>`}<p>${esc(q.explanation)}</p></div><div class="mt-6">${btn(session.index===19?"Lihat Hasil":"Soal Berikutnya","next")}</div>`:""}</section>`;
    } else if(view==="result"){
      const s=session;if(!s||s.answers.length!==s.questions.length){view="home";return render()}
      const right=s.answers.filter((a,i)=>a===s.questions[i].answer).length,wrong=s.questions.length-right;
      const message=wrong===0?"Luar biasa! Semua jawabanmu benar!":"Tidak apa-apa, yuk pelajari soal yang masih sulit!";
      const remedial=s.mode==="remedial", retry=wrong>0&&!remedial?btn("Ulangi Soal yang Salah","remedial","#ffdce7"):"";
      html=`${back("home")}<section class="card p-7 bg-[#fff5d7] text-center">${title(remedial?`Hasil Remedial Bab ${s.chapter}`:s.mode==="exam"?"Hasil Tantangan Ujian Akhir Semester 1":`Hasil Bab ${s.chapter}: ${chapters[s.chapter-1].title}`)}<p class="text-xl font-bold mb-2">${message}</p><p class="mb-6">Benar: ${right} · Salah: ${wrong} · Bintang sesi: ${right}</p><div class="flex flex-wrap justify-center gap-4">${retry}${!remedial?btn("Main Lagi dengan Soal Baru","again"):btn("Ulangi Bab dengan Soal Baru","again")}${btn("Lihat Pembahasan","reviews","#d9f2ff")}${btn("Kembali ke Daftar Bab","chapters","#c8f3de")}${!remedial?btn("Ke Tantangan Ujian Semester 1","examIntro","#ffdce7"):""}</div></section><section id="reviews" class="hidden mt-7" aria-label="Pembahasan seluruh soal"><h2 class="display text-3xl mb-5">Pembahasan semua soal</h2><div class="grid gap-4">${s.questions.map((q,i)=>`<article class="card review ${s.answers[i]===q.answer?"":"missed"} p-5"><h3 class="font-extrabold text-lg mb-2">Soal ${i+1} · ${s.answers[i]===q.answer?"Benar ⭐":"Ayo belajar 💛"}</h3><p class="font-bold">${esc(q.question)}</p>${q.visual?`<p class="visual whitespace-pre-line my-2">${esc(q.visual)}</p>`:""}<p>Jawabanmu: <strong>${esc(s.answers[i])}</strong> · Jawaban benar: <strong>${esc(q.answer)}</strong></p><p class="mt-2">${esc(q.explanation)}</p></article>`).join("")}</div></section>`;
    } else if(view==="continue"){
      const ch=store.lastChapter,score=ch?store.lastChapterScores[ch]:null;
      html=`${back("home")}${title("Lanjutkan Belajar","Petualangan angkamu menunggu!")}${ch?`<section class="card p-7 bg-[#c8f3de]"><div class="text-5xl mb-3">${chapters[ch-1].icon}</div><h2 class="display text-2xl mb-3">Bab ${ch}: ${chapters[ch-1].title}</h2><p class="mb-5">Skor terakhir bab: ${score==null?"Belum ada":score+" bintang"}</p><div class="flex flex-wrap gap-4">${store.active?btn("Lanjutkan sesi","resume"):btn("Lanjut Belajar","intro","#ffe69a",`data-ch="${ch}"`)}${btn("Main Lagi dengan Soal Baru","freshChapter","#d9f2ff",`data-ch="${ch}"`)}</div></section>`:`<section class="card p-7"><p class="mb-5">Belum ada bab yang dimainkan. Yuk, pilih petualangan pertama!</p>${btn("Pilih Bab","chapters")}</section>`}`;
    } else if(view==="help"){
      html=`${back("home")}${title("Petunjuk Bermain","Belajar sedikit demi sedikit itu menyenangkan!")}<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${["📚 Pilih bab yang ingin kamu coba.","👀 Baca soal dengan teliti.","👆 Pilih satu jawaban saja.","⭐ Dapatkan 5 bintang jika benar.","💡 Baca penjelasannya, lalu lanjut.","🔄 Coba lagi dengan soal baru."].map((x,i)=>`<div class="card p-5 font-bold"><span class="text-2xl">${i+1}.</span> ${x}</div>`).join("")}</div><div class="card p-6 mt-5 bg-[#d9f2ff]"><p>Salah tidak apa-apa. Kita belajar setahap demi setahap! Tombol suara di bagian atas bisa menghidupkan atau mematikan bunyi jawaban.</p></div><div class="mt-6">${btn("Reset Progres","reset","#ffdce7")}</div>`;
    }
    app.innerHTML=html;
    app.focus({preventScroll:true});
  }
  function open(v,ch){if(ch)chapter=ch;if(view==="question"&&session&&v!=="question")return ask("Keluar dari sesi?","Jawabanmu yang sudah diberikan tetap tersimpan. Kamu bisa melanjutkannya nanti.",()=>{view=v;render()});view=v;render()}
  function start(ch,mode="chapter"){
    try{let questions=generateSession(ch,20,mode);session={mode,chapter:ch,index:0,questions,answers:[],complete:false};store.active=session;if(mode==="chapter")store.lastChapter=ch;markHistory(session);save();view="question";render()}
    catch(e){notice("Soal belum berhasil dibuat. Silakan coba lagi.");}
  }
  function sound(ok){
    if(!store.soundEnabled)return;
    try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;audio ||= new Context();if(audio.state==="suspended")audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type="sine";o.frequency.setValueAtTime(ok?660:300,t);if(ok)o.frequency.setValueAtTime(880,t+.1);g.gain.setValueAtTime(.065,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.23)}catch(e){}
  }
  function finish(){
    if(session.complete){view="result";return render()}
    if(session.answers.length!==20)return;
    const score=session.answers.filter((a,i)=>a===session.questions[i].answer).length*5;
    if(score<0||score>100)throw Error("Skor tidak valid");
    session.complete=true;
    if(session.mode==="exam"){store.lastExamScore=score;store.lastSessions.exam=session}
    else{store.lastChapter=session.chapter;store.lastChapterScores[session.chapter]=score;store.lastSessions[session.chapter]=session}
    store.active=null;save();view="result";render();
  }
  let dialogAction=null,lastFocus=null;
  function ask(heading,text,action){lastFocus=document.activeElement;dialogAction=action;document.getElementById("dialog-title").textContent=heading;document.getElementById("dialog-text").textContent=text;document.getElementById("dialog").classList.remove("hidden");document.getElementById("dialog-cancel").focus()}
  function closeDialog(){document.getElementById("dialog").classList.add("hidden");dialogAction=null;lastFocus?.focus()}
  document.getElementById("dialog-cancel").onclick=closeDialog;
  document.getElementById("dialog-confirm").onclick=()=>{const action=dialogAction;closeDialog();action?.()};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("dialog").classList.contains("hidden"))closeDialog()});
  document.getElementById("sound-toggle").onclick=()=>{store.soundEnabled=!store.soundEnabled;save();render();if(store.soundEnabled)sound(true)};
  document.querySelectorAll("nav [data-view]").forEach(b=>b.addEventListener("click",()=>open(b.dataset.view)));
  app.addEventListener("click",e=>{
    const b=e.target.closest("[data-action]");if(!b)return;
    const act=b.dataset.action,ch=Number(b.dataset.ch);
    if(act==="back"){open(b.dataset.to||"chapters");return}
    if(["chapters","help","examIntro"].includes(act)){open(act);return}
    if(act==="intro"){open("intro",ch);return}
    if(act==="continueStart"){if(store.active&&store.active.questions?.length===20){session=store.active;view="question";render()}else if(store.lastChapter)open("intro",store.lastChapter);else open("chapters");return}
    if(act==="resume"){if(store.active){session=store.active;view="question";render()}else open("intro",store.lastChapter);return}
    if(act==="start"){start(chapter);return}
    if(act==="startExam"){start(0,"exam");return}
    if(act==="freshChapter"){start(ch);return}
    if(act==="answer"){
      if(!session||session.answers[session.index]!=null)return;
      const q=session.questions[session.index],choice=q.choices[Number(b.dataset.choice)];
      if(choice==null)return;
      session.answers[session.index]=choice;store.active=session;save();sound(choice===q.answer);render();return;
    }
    if(act==="next"){if(session?.answers[session.index]==null)return;if(session.index===19)finish();else{session.index++;store.active=session;save();render()}return}
    if(act==="again"){start(session.mode==="exam"?0:session.chapter,session.mode);return}
    if(act==="remedial"){const missed=session.questions.filter((q,i)=>session.answers[i]!==q.answer);session={mode:"remedial",chapter:session.chapter,index:0,questions:missed,answers:[],complete:false};store.active=session;save();view="question";render();return}
    if(act==="reviews"){const section=document.getElementById("reviews");section.classList.remove("hidden");section.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});return}
    if(act==="reset")ask("Reset semua progres?","Skor, bintang, sesi, dan riwayat soal di perangkat ini akan dihapus. Tindakan ini tidak bisa dibatalkan.",()=>{store=defaults();session=null;save();view="home";render();notice("Progres sudah direset. Yuk mulai lagi!")});
  });
  if(store.active?.questions?.length===20&&Array.isArray(store.active.answers)&&store.active.index>=0&&store.active.index<20&&!store.active.complete){session=store.active;chapter=session.chapter||1}
  render();
  if(!storageOK)notice("Penyimpanan perangkat tidak tersedia. Permainan tetap berjalan, tetapi progres mungkin hilang saat halaman ditutup.");
})();
</script>
 
</body></html>
